<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:16px;background:#111820;color:#eee;font:15px system-ui}h2{margin:0 0 16px}.frame{width:180px;height:110px;overflow:hidden;border:3px solid #6ba5c9;background:#203445}.scroller{width:280px;height:190px;overflow:auto;background:#3b2d28}.row{height:40px;border-bottom:1px solid #888;padding-left:8px;box-sizing:border-box}.outside{height:100px;background:#334431;padding:14px;margin-top:10px}.side{position:absolute;left:215px;top:78px;width:150px;height:100px;background:#334431;padding:12px;box-sizing:border-box}.status{white-space:pre-wrap;font:13px monospace}button{padding:10px;background:#265780;border:0;color:white;font:inherit;border-radius:7px}
</style></head><body><h2>Clipped scroll input</h2><div class=frame><div id=scroller class=scroller></div></div><div class=side>Wheel here must not move the list.</div><div class=outside>Wheel here must not move the list above.</div><p id=status class=status>List scroll: 0</p><button id=reset>Reset</button> <button id=mode>Use overflow: clip</button><script>
const list=document.getElementById('scroller'),status=document.getElementById('status');for(let i=1;i<=20;i++){const row=document.createElement('div');row.className='row';row.textContent='List row '+i;list.appendChild(row)}list.addEventListener('scroll',()=>{status.textContent='List scroll: '+Math.round(list.scrollTop);console.log('list-scroll',list.scrollTop)});document.getElementById('reset').onclick=()=>list.scrollTo(0,0);document.getElementById('mode').onclick=function(){document.querySelector('.frame').style.overflow='clip';this.textContent='Using overflow: clip';};
</script></body></html>
