<!doctype html>
<meta charset="utf-8">
<style>
body { margin: 20px; background: #17232c; color: #eee; font: 16px/1.4 system-ui }
.viewport { width: 300px; height: 100px; overflow: hidden; border: 2px solid #649ab5; margin: 16px 0 }
.track { display: flex; width: 900px; height: 100px }
.page { flex: 0 0 300px; display: flex; align-items: center; justify-content: center; font-size: 28px; height: 100px }
.a { background: #77464b }.b { background: #275f76 }.c { background: #356442 }
.row { height: 50px; padding-left: 16px; box-sizing: border-box; line-height: 50px }
button { padding: 8px; margin: 4px; color: white; background: #285b7a; border: 0; border-radius: 6px }
pre { white-space: pre-wrap; font: 13px/1.5 Courier }
</style>
<h2>Hidden overflow scrolling</h2>
<p>Buttons scroll. Wheel gestures leave each box in place.</p>
<div id="carousel" class="viewport"><div class="track"><div class="page a">First</div><div class="page b">Second</div><div id="last" class="page c">Third</div></div></div>
<button id="left">First</button><button id="right">Second</button><button id="reveal">Reveal third</button>
<div id="vertical" class="viewport"><div class="row a">Row 1</div><div class="row b">Row 2</div><div class="row c">Row 3</div><div class="row a">Row 4</div><div class="row b">Row 5</div><div class="row c">Row 6</div></div>
<button id="top">Top</button><button id="bottom">Bottom</button>
<pre id="stats"></pre>
<script>
const carousel = document.getElementById('carousel');
const vertical = document.getElementById('vertical');
const stats = document.getElementById('stats');
function report() { stats.textContent = 'left: ' + carousel.scrollLeft + ' / ' + carousel.scrollWidth + '\ntop: ' + vertical.scrollTop + ' / ' + vertical.scrollHeight; }
document.getElementById('left').onclick = () => { carousel.scrollLeft = 0; report(); };
document.getElementById('right').onclick = () => { carousel.scrollLeft = 300; report(); };
document.getElementById('reveal').onclick = () => { document.getElementById('last').scrollIntoView({block:'nearest',inline:'nearest'}); report(); };
document.getElementById('top').onclick = () => { vertical.scrollTop = 0; report(); };
document.getElementById('bottom').onclick = () => { vertical.scrollTop = 999; report(); };
carousel.onscroll = report;
vertical.onscroll = report;
report();
</script>
