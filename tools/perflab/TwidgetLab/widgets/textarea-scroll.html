<!doctype html><meta charset=utf-8><style>body{margin:20px;background:#17232c;color:#eee;font:16px/1.4 system-ui}textarea,input{display:block;box-sizing:border-box;width:260px;padding:10px;border:2px solid #649ab5;background:#253d4a;color:white;font:16px/24px Courier;margin:12px 0}textarea{height:120px;resize:none}button{padding:8px;margin:4px;color:white;background:#285b7a;border:0;border-radius:6px}pre{font:13px/1.5 Courier}</style><h2>Textarea scroll continuity</h2><textarea id=field></textarea><input id=other placeholder='Click to blur'><button id=top>Top</button><button id=bottom>Bottom</button><button id=short>Short text</button><pre id=stats></pre><script>const field=document.getElementById('field'),stats=document.getElementById('stats');field.value=Array.from({length:16},(_,i)=>'Line '+String(i+1).padStart(2,'0')+' — scroll test').join('\n');function report(){stats.textContent='scrollTop: '+Math.round(field.scrollTop)+'\nscrollHeight: '+field.scrollHeight+'\nclientHeight: '+field.clientHeight;console.log(stats.textContent)}field.onscroll=report;field.oninput=report;field.onblur=report;field.onfocus=report;document.getElementById('top').onclick=()=>{field.scrollTop=0;report()};document.getElementById('bottom').onclick=()=>{field.scrollTop=field.scrollHeight;report()};document.getElementById('short').onclick=()=>{field.value='Short text';report()};report()</script>
