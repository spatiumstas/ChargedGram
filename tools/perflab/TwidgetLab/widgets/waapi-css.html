<style>body{margin:0}.t{margin:6px;width:60px;height:16px;background:#5856d6}
@keyframes spin{to{transform:rotate(90deg)}}@keyframes fade{from{opacity:1}to{opacity:.3}}
#a{animation:spin 2s linear infinite, fade 1s ease-in 2 alternate both}
#b{transition:opacity .3s linear, transform .5s ease-out}</style>
<div id="w"><div class="t" id="a"></div><div class="t" id="b"></div></div>
<script>
const L = [];
const log = (...x) => L.push(x.join(' '));
const a = document.getElementById('a'), b = document.getElementById('b');
const list = a.getAnimations();
log('a', list.length, list.map(x => x.constructor.name + ':' + x.animationName + ':' + x.playState).join(','));
log('same', a.getAnimations()[0] === list[0], list[0] instanceof Animation, list[0] instanceof CSSAnimation, list[0].effect.getTiming().duration, list[0].effect.getTiming().iterations, list[1].effect.getTiming().direction, list[1].effect.getTiming().fill);
b.style.opacity = '0.5';
b.style.transform = 'translateX(20px)';
const t = b.getAnimations();
log('b', t.length, t.map(x => x.constructor.name + ':' + x.transitionProperty).sort().join(','));
log('doc', document.getAnimations().length, document.getElementById('w').getAnimations({ subtree: true }).length);
const s = a.getAnimations().find(x => x.animationName === 'spin');
s.pause();
s.currentTime = 500;
log('pause', s.playState, s.currentTime);
Promise.all(t.map(x => x.finished)).then(() => log('transitions finished', b.getAnimations().length));
setTimeout(() => { L.forEach(l => console.log(l)); }, 1000);
</script>
