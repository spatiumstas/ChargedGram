<style>body { margin: 0; font-family: -apple-system, system-ui, sans-serif; } .card { padding: 10px; } .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }</style>
<div class="card"><div class="v" id="v">0</div>
<svg width="380" height="160" viewBox="0 0 380 160">
<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#007aff" stop-opacity="0.35"/><stop offset="1" stop-color="#007aff" stop-opacity="0"/></linearGradient></defs>
<path id="area" fill="url(#a)" d=""/><polyline id="line" fill="none" stroke="#007aff" stroke-width="1.5" points=""/>
<circle id="dot" r="3.5" fill="#007aff" cx="0" cy="0"/></svg></div>
<script>
const N = 500, line = document.getElementById('line'), area = document.getElementById('area'), dot = document.getElementById('dot'), v = document.getElementById('v');
let t = 0;
function frame() {
  t += 0.02;
  let pts = '', last = 0;
  for (let i = 0; i < N; i++) {
    const x = i * 380 / (N - 1);
    const y = 80 + Math.sin(i * 0.05 + t) * 40 + Math.sin(i * 0.013 + t * 1.7) * 25;
    pts += x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    last = y;
  }
  line.setAttribute('points', pts);
  area.setAttribute('d', 'M0,160 L' + pts.trim().split(' ').join(' L') + ' L380,160 Z');
  dot.setAttribute('cx', '380'); dot.setAttribute('cy', last.toFixed(1));
  v.textContent = (1000 + last * 3).toFixed(2);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
