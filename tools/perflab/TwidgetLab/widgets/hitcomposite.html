<style>body{margin:0} @keyframes hold { from { transform: translateX(200px) } to { transform: translateX(200px) } } #box { width: 40px; height: 40px; background: #3390ec; animation: hold 30s linear infinite; } #out { margin-top: 10px; font: 14px -apple-system }</style>
<div id="box"></div><div id="out">none</div>
<script>document.getElementById('box').addEventListener('click', () => { document.getElementById('out').textContent = 'box clicked'; });</script>
