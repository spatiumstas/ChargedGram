<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; }
.bar { display: flex; gap: 8px; padding: 10px; }
button { font: inherit; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 8px; background: #007aff; color: #fff; }
.list { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px 10px; }
.card { width: 110px; padding: 10px; border-radius: 12px; color: #fff; font-weight: 700; }
.wide { width: 236px; }
</style>
<div class="bar"><button id="go">Shuffle</button><button id="add">Add</button></div>
<div class="list" id="list" data-transition="move"></div>
<script>
const colors = ['#ff3b30', '#ff9500', '#34c759', '#5856d6', '#007aff', '#af52de', '#ff2d55', '#30b0c7'];
let items = [0, 1, 2, 3, 4, 5], next = 6, round = 0;
function draw() {
  document.getElementById('list').innerHTML = items.map((n, i) =>
    `<div class="card${n % 4 === 1 ? ' wide' : ''}" data-key="c${n}" style="background-color: ${colors[n % colors.length]}">Card ${n}<br><span style="font-weight: 400">item ${i + 1}</span></div>`).join('');
}
document.getElementById('go').onclick = () => {
  round++;
  items = items.slice().reverse();
  items.splice(1, 1);
  items.push(next++);
  draw();
};
document.getElementById('add').onclick = () => { items.unshift(next++); draw(); };
draw();
</script>
