<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
.g { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; }
.b { width: 36px; height: 36px; border-radius: 8px; background: #5856d6; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slide { from { transform: translateX(0) scale(1); } 40% { transform: translateX(30px) scale(1.2); animation-timing-function: cubic-bezier(.3,1.6,.6,1); } to { transform: translateX(-20%) scale(.8); } }
@keyframes fade { 0% { opacity: 1; } 50% { opacity: .2; } 100% { opacity: 1; } }
@keyframes pop { from { transform: scale(.5) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0deg); opacity: 1; } }
@keyframes tick { to { transform: translateY(20px); } }
@keyframes skew { 0% { transform: skewX(0deg) translate(0, 0); } 100% { transform: skewX(20deg) translate(10px, 5px); } }
</style>
<div class="g">
  <div class="b" style="animation: spin 1.3s linear infinite"></div>
  <div class="b" style="animation: spin 1.1s ease-in-out infinite reverse; transform-origin: 0 0"></div>
  <div class="b" style="animation: slide 1.7s ease infinite alternate"></div>
  <div class="b" style="animation: slide 1.5s linear infinite alternate-reverse; transform-origin: right bottom"></div>
  <div class="b" style="animation: fade 0.9s cubic-bezier(.2,.8,.2,1) infinite"></div>
  <div class="b" style="animation: pop 0.8s cubic-bezier(.34,1.56,.64,1) 0.4s both"></div>
  <div class="b" style="animation: pop 1.2s ease -0.5s 2.5 alternate forwards"></div>
  <div class="b" style="animation: spin 2s linear(0, 0.25 40%, 1) infinite"></div>
  <div class="b" style="animation: tick 1s steps(4) infinite"></div>
  <div class="b" style="animation: skew 1.4s ease-in-out 0.2s infinite alternate backwards"></div>
  <div class="b" style="animation: pop 0.6s ease-out 3s 1 backwards"></div>
  <div class="b" style="animation: fade 2s linear 1.2 forwards"></div>
</div>
