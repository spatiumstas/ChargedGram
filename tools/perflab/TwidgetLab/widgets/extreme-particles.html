<style>body { margin: 0; } canvas { display: block; width: 400px; height: 300px; background: #0b1020; }</style>
<canvas id="cv" width="800" height="600"></canvas>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const N = 1500, ps = [];
for (let i = 0; i < N; i++) ps.push({ x: Math.random() * 800, y: Math.random() * 600, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, h: (i * 7) % 360 });
function frame() {
  ctx.fillStyle = 'rgba(11,16,32,0.35)';
  ctx.fillRect(0, 0, 800, 600);
  for (const p of ps) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > 800) p.vx = -p.vx;
    if (p.y < 0 || p.y > 600) p.vy = -p.vy;
    ctx.fillStyle = `hsl(${p.h},90%,60%)`;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
