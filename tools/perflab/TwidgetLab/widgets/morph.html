<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; }
.bar { display: flex; gap: 8px; padding: 10px; }
button { font: inherit; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 8px; background: #007aff; color: #fff; }
.list { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; padding: 0 10px 10px; }
.card { width: 110px; padding: 10px; border-radius: 12px; color: #fff; font-weight: 700; }
.wide { width: 236px; }
.note { font-weight: 400; }
.chip { padding: 4px 10px; border-radius: 13px; background-color: #e5e5ea; color: #111; }
</style>
<div class="bar"><button id="go">Morph</button><button id="add">Add</button></div>
<div class="list" id="list" data-transition="move"></div>
<script>
let open = false, extra = 0;
function draw() {
  const a = `<div class="card${open ? ' wide' : ''}" data-key="a" style="background-color: #ff3b30">Card A<br><span class="note">${open ? 'expanded to show more' : 'compact'}</span></div>`;
  const b = `<div class="card" data-key="b" style="background-color: #34c759">Card B<br><span class="note">one line${open ? '<br>two lines<br>three lines' : ''}</span></div>`;
  const c = `<div class="card" data-key="c" style="background-color: #5856d6">Card C</div>`;
  const chips = ['alpha', open ? 'beta gamma delta' : 'beta', 'epsilon'].map((t, i) => `<div class="chip" data-key="chip${i}">${t}</div>`).join('');
  const more = Array.from({length: extra}, (_, i) => `<div class="chip" data-key="x${i}">extra ${i}</div>`).join('');
  document.getElementById('list').innerHTML = (open ? b + a + c : a + b + c) + chips + more;
}
document.getElementById('go').onclick = () => { open = !open; draw(); };
document.getElementById('add').onclick = () => { extra++; draw(); };
draw();
</script>
