<!doctype html>
<meta charset="utf-8">
<style>
body { margin:20px; background:#17232c; color:#eee; font:16px/1.4 system-ui }
.viewport { width:300px; height:120px; overflow:auto; border:2px solid #649ab5; margin:16px 0 }
.track { height:120px; background:linear-gradient(#275f76,#77464b); position:relative }
.end { position:absolute; bottom:0; height:50px; width:100%; background:#356442; line-height:50px; text-align:center }
button { padding:8px; margin:4px; background:#285b7a; color:white; border:0; border-radius:6px }
</style>
<h2>Scroll after layout changes</h2>
<p>Each action should reveal the green end marker.</p>
<div id="existing" class="viewport"><div id="track" class="track"><div class="end">End</div></div></div>
<button id="expand">Expand and scroll</button><button id="shrink">Reset</button><button id="create">Create scrolled box</button>
<div id="newbox"></div><pre id="status">Ready</pre>
<script>
const box=document.getElementById('existing'),track=document.getElementById('track'),status=document.getElementById('status');
function report(target){status.textContent='Scroll top: '+target.scrollTop+' / '+(target.scrollHeight-target.clientHeight);}
document.getElementById('expand').onclick=()=>{track.style.height='600px';box.scrollTop=9999;setTimeout(()=>report(box),50)};
document.getElementById('shrink').onclick=()=>{track.style.height='120px';box.scrollTop=0;document.getElementById('newbox').textContent='';setTimeout(()=>report(box),50)};
document.getElementById('create').onclick=()=>{const next=document.createElement('div');next.className='viewport';next.innerHTML='<div class="track" style="height:600px"><div class="end">New end</div></div>';document.getElementById('newbox').replaceChildren(next);next.scrollTo(0,9999);setTimeout(()=>report(next),50)};
</script>
