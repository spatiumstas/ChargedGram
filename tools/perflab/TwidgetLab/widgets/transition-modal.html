<style>
body { margin: 0; padding: 16px; box-sizing: border-box; font: 14px -apple-system, sans-serif; background: #101820; color: #f7f7fa; }
h2 { margin: 0 0 12px; font-size: 20px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
button { border: 0; border-radius: 8px; padding: 8px 12px; background: #273c50; color: white; font: inherit; cursor: pointer; }
.stage { height: 244px; position: relative; border: 1px solid #405364; border-radius: 12px; overflow: hidden; }
.sheet { position: absolute; left: 20px; right: 20px; top: 20px; padding: 16px; border-radius: 12px; background: #263849; transform: translateY(28px); opacity: 0.2; transition: transform 900ms ease-in-out, opacity 1300ms ease-in-out 100ms; }
.sheet.open { transform: translateY(0px); opacity: 1; }
h3 { margin: 0 0 12px; }
p { margin: 10px 0; }
input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #718096; border-radius: 6px; color: white; background: #152432; font: inherit; }
.tiles { display: flex; gap: 16px; margin: 18px 0; height: 48px; align-items: center; }
.tile { width: 48px; height: 32px; border-radius: 8px; background: #318ee4; text-align: center; line-height: 32px; opacity: 0.2; transition: transform 900ms ease-in-out, opacity 1300ms ease-in-out 100ms; }
.scale { transform: scale(0.8); }
.turn { transform: rotate(-20deg); }
.slide { transform: translateX(0px); transition: transform 1s linear(0, .3, 1.1, 1), opacity 600ms ease-in 300ms; }
.scale.open { transform: scale(1); opacity: 1; }
.turn.open { transform: rotate(20deg); opacity: 1; }
.slide.open { transform: translateX(32px); opacity: 1; }
#status { color: #b6c7d8; font-size: 12px; }
</style>
<h2>Move and fade transitions</h2>
<div class="controls">
<button id="toggle">Toggle</button><button id="reverse">Reverse twice</button><button id="replay">Replay</button><button id="auto">Stop auto</button>
</div>
<div class="stage"><div id="sheet" class="sheet"><h3>Card details</h3><input placeholder="Click and type while moving" value="Preserve focus"><p>Independent move and fade timing</p><button id="close">Close</button></div></div>
<div class="tiles"><div class="tile scale">Scale</div><div class="tile turn">Turn</div><div class="tile slide">Slide</div></div>
<div id="status">Ready</div>
<script>
var items = [document.getElementById('sheet')].concat(Array.from(document.querySelectorAll('.tile')));
var opened = false, ends = 0, cycles = 0, automatic = true, timer;
function status() {
  document.getElementById('status').textContent = (opened ? 'Open' : 'Closed') + ' | transition ends ' + ends;
}
function setOpen(value) {
  opened = value;
  items.forEach(function(item) { if (value) item.classList.add('open'); else item.classList.remove('open'); });
  status();
}
function stop() { automatic = false; clearTimeout(timer); document.getElementById('auto').textContent = 'Start auto'; }
function cycle() {
  if (!automatic) return;
  setOpen(!opened);
  if (++cycles < 8) timer = setTimeout(cycle, 1800); else stop();
}
items.forEach(function(item) {
  item.addEventListener('transitionend', function(event) {
    ends++;
    status();
  });
});
document.getElementById('toggle').onclick = function() { stop(); setOpen(!opened); };
document.getElementById('close').onclick = function() { stop(); setOpen(false); };
document.getElementById('reverse').onclick = function() { stop(); setOpen(!opened); setTimeout(function() { setOpen(!opened); }, 300); setTimeout(function() { setOpen(!opened); }, 600); };
document.getElementById('replay').onclick = function() {
  stop(); items.forEach(function(item) { item.style.transition = 'none'; }); setOpen(false);
  setTimeout(function() { items.forEach(function(item) { item.style.transition = ''; }); setOpen(true); }, 80);
};
document.getElementById('auto').onclick = function() { if (automatic) stop(); else { automatic = true; cycles = 0; this.textContent = 'Stop auto'; cycle(); } };
timer = setTimeout(cycle, 250);
</script>
