<!doctype html>
<meta charset="utf-8">
<style>
body { margin: 20.25px; background: white; color: #123; font: 16px/1.4 system-ui }
.viewport { width: 300px; height: 150px; overflow: auto; border: 2px solid #123; margin: 16.25px 0 }
.track { width: 900px; height: 400px; background: rgba(80,160,200,.5); position: relative }
.mark { position: absolute; left: 550px; top: 230px; color: black }
button { padding: 10px; margin: 8px }
pre { white-space: pre-wrap }
</style>
<h2>Translucent tile boundaries</h2>
<p>Scroll horizontally and vertically. The fill should stay uniform across every tile.</p>
<div id="box" class="viewport"><div class="track"><span class="mark">Text crosses tile rows</span></div></div>
<button id="first">First</button><button id="fraction">Fractional</button><button id="motion">Animate</button>
<pre id="status"></pre>
<script>
const box = document.getElementById('box');
const status = document.getElementById('status');
let generation = 0;
function report() { status.textContent = 'Offset ' + box.scrollLeft.toFixed(2) + ', ' + box.scrollTop.toFixed(2); }
function move(x, y) { box.scrollLeft = x; box.scrollTop = y; }
document.getElementById('first').onclick = () => { generation++; move(0, 0); report(); };
document.getElementById('fraction').onclick = () => { generation++; move(430.4, 190.3); report(); };
document.getElementById('motion').onclick = () => {
  const current = ++generation;
  let start;
  requestAnimationFrame(function step(t) {
    if (current !== generation) return;
    if (start === undefined) start = t;
    const p = Math.min(1, (t - start) / 10000);
    move(p * 600, p * 250);
    if (p < 1) requestAnimationFrame(step);
    else report();
  });
};
move(430.4, 190.3);
report();
</script>
