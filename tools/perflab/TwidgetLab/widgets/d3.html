<div style="padding:12px;font-family:-apple-system,system-ui,sans-serif">
  <div style="font-weight:700;margin-bottom:8px">Latency (ms)</div>
  <svg id="s" width="360" height="180"></svg>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const data = [42, 38, 51, 47, 60, 55, 49, 66, 58, 52, 61, 70];
const svg = d3.select('#s'), w = 360, h = 180, m = { t: 10, r: 10, b: 24, l: 32 };
const x = d3.scaleLinear().domain([0, data.length - 1]).range([m.l, w - m.r]);
const y = d3.scaleLinear().domain([30, 75]).range([h - m.b, m.t]);
svg.append('g').attr('transform', `translate(0,${h - m.b})`).call(d3.axisBottom(x).ticks(6));
svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5));
svg.append('path').datum(data).attr('fill', 'none').attr('stroke', '#34c759').attr('stroke-width', 2)
  .attr('d', d3.line().x((d, i) => x(i)).y(d => y(d)).curve(d3.curveMonotoneX));
svg.selectAll('circle').data(data).join('circle').attr('cx', (d, i) => x(i)).attr('cy', d => y(d)).attr('r', 3).attr('fill', '#34c759');
</script>
