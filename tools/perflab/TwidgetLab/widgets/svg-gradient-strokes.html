<!doctype html><meta charset="utf-8">
<style>
body{margin:0;padding:16px;font:15px/1.4 system-ui;background:#17191f;color:white}
button{font:inherit;padding:10px;border:0;border-radius:8px;background:#376bad;color:white;margin-right:8px}
svg{display:block;width:360px;height:400px;margin-top:16px}
</style>
<h2>Gradient strokes</h2>
<button id="color">Change color</button><button id="dash">Toggle dashes</button>
<p>Linear curve, translucent dashed box, radial ring</p>
<svg viewBox="0 0 360 400">
<defs>
<linearGradient id="linear" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="340" y2="0"><stop id="start" stop-color="#ff426d"/><stop offset="1" stop-color="#3388ff"/></linearGradient>
<radialGradient id="radial" gradientUnits="userSpaceOnUse" cx="140" cy="310" r="100"><stop stop-color="#ffdd33"/><stop offset="1" stop-color="#ff426d" stop-opacity="0"/></radialGradient>
</defs>
<path d="M20 60 Q100 -10 180 60 T340 60" fill="none" stroke="url(#linear)" stroke-width="16" stroke-linecap="round"/>
<rect id="box" x="20" y="120" width="320" height="70" rx="14" fill="#202735" stroke="url(#linear)" stroke-width="14" stroke-dasharray="24 12" stroke-dashoffset="5" stroke-opacity=".6"/>
<circle cx="180" cy="300" r="66" fill="none" stroke="url(#radial)" stroke-width="24"/>
</svg>
<script>
var green=false,dashed=true;
document.getElementById('color').onclick=function(){green=!green;document.getElementById('start').setAttribute('stop-color',green?'#33ff88':'#ff426d')};
document.getElementById('dash').onclick=function(){dashed=!dashed;document.getElementById('box').setAttribute('stroke-dasharray',dashed?'24 12':'none')};
</script>
