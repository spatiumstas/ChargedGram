<!doctype html><meta charset=utf-8><style>body{margin:16px;background:#18222d;color:white;font:16px/24px Courier}.case{width:200px;overflow-wrap:break-word;background:#30485c;margin-bottom:16px}h3{font:15px system-ui;margin:12px 0}.float{float:left;width:80px;height:60px;background:#347b78}pre{white-space:pre-wrap;font:13px/20px Courier}</style><h3>Long word beside a float</h3><div id=a class=case><div class=float></div>ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz</div><h3>Short word with 100px indent</h3><div id=b class=case style=text-indent:100px>ABCDEFGHIJKLMNOP</div><h3>Long word with 100px indent</h3><div id=c class=case style=text-indent:100px>ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz</div><h3>Short word beside a float</h3><div id=d class=case><div class=float></div>ABCDEFGHIJKLMNOP</div><pre id=stats></pre><script>document.getElementById('stats').textContent=['a','b','c','d'].map(id=>id+': '+document.getElementById(id).getBoundingClientRect().height+' px').join('\n')</script>
