<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(1.15); } }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(300px); } }
.row { display: flex; gap: 12px; padding: 12px; }
.s { width: 40px; height: 40px; border-radius: 8px; background: #5856d6; animation: spin 1.2s linear infinite; }
.p { width: 40px; height: 40px; border-radius: 20px; background: #ff9500; animation: pulse 1s ease-in-out infinite; }
.l { width: 30px; height: 30px; border-radius: 6px; background: #34c759; animation: slide 2s ease-in-out infinite alternate; }
</style>
<div class="row"><div class="s"></div><div class="p"></div><div class="s" style="animation-duration: .8s"></div><div class="p" style="animation-delay: .3s"></div></div>
<div class="row"><div class="l"></div></div>
<div class="row"><div class="l" style="animation-timing-function: cubic-bezier(.3,1.6,.6,1)"></div></div>
