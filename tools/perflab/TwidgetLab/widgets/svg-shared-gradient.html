<!doctype html><meta charset="utf-8">
<style>
body{margin:0;padding:16px;font:15px/1.4 system-ui;background:#17191f;color:white;--paint:url(#paint)}
button{font:inherit;padding:10px;border:0;border-radius:8px;background:#376bad;color:white}
.filled{fill:url(#paint)}
.sample{display:block;width:300px;height:70px;margin:8px 0 16px}
</style>
<h2>Shared SVG gradient</h2>
<button id="toggle">Toggle red / green</button>
<p id="status">Start color: red</p>
<svg width="0" height="0"><defs><linearGradient id="paint"><stop id="stop" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient></defs></svg>
<div>Presentation attribute</div>
<svg class="sample" viewBox="0 0 300 70"><rect width="300" height="70" fill="URL(#paint)"/></svg>
<div>CSS class</div>
<svg class="sample" viewBox="0 0 300 70"><rect width="300" height="70" class="filled"/></svg>
<div>CSS variable</div>
<svg class="sample" viewBox="0 0 300 70"><rect width="300" height="70" style="fill:var(--paint)"/></svg>
<script>
var green=false;
document.getElementById('toggle').onclick=function(){green=!green;document.getElementById('stop').setAttribute('stop-color',green?'#00ff00':'#ff0000');document.getElementById('status').textContent='Start color: '+(green?'green':'red')};
</script>
