<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
.track { position: relative; height: 120px; background: #f2f2f7; border-radius: 12px; overflow: hidden; }
.dot { position: absolute; top: 40px; left: 0; width: 40px; height: 40px; border-radius: 20px; background: #3390ec; }
.bar { height: 8px; background: #34c759; border-radius: 4px; margin-top: 8px; }
</style>
<div class="track"><div class="dot" id="dot"></div></div>
<div class="bar" id="bar"></div>
<div id="fps">0 frames</div>
<script>
const dot = document.getElementById('dot'), bar = document.getElementById('bar'), out = document.getElementById('fps');
let frames = 0, start = 0;
function tick(t) {
  if (!start) start = t;
  frames++;
  const p = ((t - start) / 1500) % 1;
  dot.style.transform = 'translateX(' + (p * 340).toFixed(1) + 'px)';
  bar.style.width = (p * 100).toFixed(1) + '%';
  if (frames % 10 === 0) out.textContent = frames + ' frames, ' + (frames / ((t - start) / 1000)).toFixed(1) + ' fps';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
