<div style="padding:12px;font-family:-apple-system,system-ui,sans-serif">
  <div style="font-weight:700;margin-bottom:8px">Weekly signups</div>
  <canvas id="c" height="200"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
new Chart(document.getElementById('c'), {
  type: 'bar',
  data: {
    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
    datasets: [
      { label: 'New', data: [12, 19, 7, 15, 22, 9, 14], backgroundColor: '#3390ec' },
      { label: 'Returning', type: 'line', data: [8, 11, 10, 13, 17, 12, 16], borderColor: '#ff9500', tension: 0.35 }
    ]
  },
  options: { animation: false, responsive: true, plugins: { legend: { position: 'bottom' } } }
});
</script>
