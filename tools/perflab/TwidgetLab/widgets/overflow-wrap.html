<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#141b23;color:#eee;font:15px/1.4 system-ui}h2{margin:0 0 12px}button{padding:8px;margin:0 5px 8px 0;border:0;border-radius:7px;background:#28577c;color:white;font:inherit}.sample{width:200px;padding:8px;border:2px solid #75a6c8;font:16px/24px Courier;overflow-wrap:break-word;white-space:pre-wrap;background:#253544}textarea{display:block;width:200px;height:130px;resize:none;padding:8px;border:2px solid #75a6c8;background:#253544;color:#eee;font:16px/24px Courier;margin:12px 0}input{width:100%}pre{font:12px/1.5 monospace;white-space:pre-wrap}
</style></head><body><h2>Long text wrapping</h2><button id=ascii>ASCII</button><button id=unicode>Unicode</button><button id=normal>Normal</button><button id=anywhere>Anywhere</button><div id=sample class=sample></div><textarea id=field></textarea><label>Width <input id=width type=range min=80 max=360 value=200></label><pre id=stats></pre><script>
const sample=document.getElementById('sample'),field=document.getElementById('field'),width=document.getElementById('width'),stats=document.getElementById('stats');const ascii='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';function report(){stats.textContent='width: '+width.value+'\ntext height: '+sample.getBoundingClientRect().height+'\ntextarea scroll: '+field.scrollWidth+' × '+field.scrollHeight;console.log(stats.textContent)}function show(text){sample.textContent=text;field.value=text;report()}document.getElementById('ascii').onclick=()=>show(ascii);document.getElementById('unicode').onclick=()=>show('éééééééééééééééééééééééééééééé👩‍👩‍👧‍👦👩‍👩‍👧‍👦🇦🇪🇦🇪');document.getElementById('normal').onclick=()=>{sample.style.overflowWrap='normal';report()};document.getElementById('anywhere').onclick=()=>{sample.style.overflowWrap='anywhere';report()};width.oninput=()=>{sample.style.width=field.style.width=width.value+'px';report()};field.oninput=()=>{sample.textContent=field.value;report()};show(ascii);
</script></body></html>
