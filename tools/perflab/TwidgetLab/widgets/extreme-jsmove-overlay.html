<style>body { margin: 0; } .f { position: relative; height: 300px; overflow: hidden; background: #0b1020; } .b { position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 7px; } .o { position: absolute; left: 120px; top: 90px; width: 140px; height: 50px; background: rgba(255,255,255,0.85); border-radius: 12px; } .r { position: absolute; left: 300px; top: 200px; width: 60px; height: 60px; border-radius: 30px; background: #fff; }</style>
<div class="f" id="f"></div><div class="o"></div><div class="r"></div>
<script>
const f = document.getElementById('f'), N = 200, items = [];
let html = '';
for (let i = 0; i < N; i++) html += `<div class="b" id="b${i}" style="background:hsl(${i * 1.8},90%,60%)"></div>`;
f.innerHTML = html;
for (let i = 0; i < N; i++) items.push({ el: document.getElementById('b' + i), x: Math.random() * 380, y: Math.random() * 280, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 });
function frame() {
  for (const p of items) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > 380) p.vx = -p.vx;
    if (p.y < 0 || p.y > 280) p.vy = -p.vy;
    p.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px)`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
