<style>body { margin: 0; } canvas { display: block; width: 300px; height: 220px; }</style>
<canvas id="cv" width="600" height="440"></canvas>
<script>
const ctx = document.getElementById('cv').getContext('2d');
ctx.scale(2, 2);
ctx.fillStyle = '#f2f2f7'; ctx.fillRect(0, 0, 300, 220);
const g = ctx.createLinearGradient(0, 0, 300, 0); g.addColorStop(0, 'hsl(210,90%,55%)'); g.addColorStop(1, 'rgba(175,82,222,0.8)');
ctx.fillStyle = g; ctx.fillRect(10, 10, 280, 30);
const r = ctx.createRadialGradient(60, 100, 5, 60, 100, 40); r.addColorStop(0, '#fff'); r.addColorStop(1, '#34c759');
ctx.fillStyle = r; ctx.beginPath(); ctx.arc(60, 100, 40, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = 'rgb(255,59,48)'; ctx.lineWidth = 3; ctx.setLineDash([6, 4]); ctx.lineCap = 'round';
ctx.beginPath(); ctx.moveTo(120, 70); ctx.bezierCurveTo(160, 40, 200, 140, 280, 90); ctx.stroke(); ctx.setLineDash([]);
ctx.save(); ctx.translate(200, 160); ctx.rotate(0.3); ctx.globalAlpha = 0.6; ctx.fillStyle = 'orange'; ctx.fillRect(-30, -15, 60, 30); ctx.restore();
ctx.font = 'bold 16px -apple-system'; ctx.fillStyle = '#1c1c1e'; ctx.textAlign = 'center'; ctx.fillText('Golden ✓ 42', 150, 200);
ctx.font = 'italic 12px Georgia, serif'; ctx.textAlign = 'left'; ctx.strokeStyle = '#007aff'; ctx.lineWidth = 1; ctx.strokeText('stroke text', 10, 160);
const img = ctx.getImageData(20, 20, 40, 10); ctx.putImageData(img, 230, 120);
ctx.beginPath(); ctx.rect(100, 120, 50, 30); ctx.roundRect && ctx.roundRect(100, 160, 50, 20, 6); ctx.fillStyle = 'hsl(30 90% 50% / 0.7)'; ctx.fill('evenodd');
for (let i = 0; i < 24; i++) { ctx.fillStyle = `hsl(${i * 15},80%,50%)`; ctx.fillRect(10 + i * 11, 50, 9, 9); }
</script>
