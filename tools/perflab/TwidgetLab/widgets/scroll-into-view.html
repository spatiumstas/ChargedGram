<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#111820;color:#eee;font:14px system-ui}h2{margin:0 0 12px}button{font:inherit;color:white;background:#245a88;border:0;border-radius:7px;padding:9px;margin:0 4px 8px 0}.outer{width:360px;height:220px;overflow:auto;border:2px solid #6796b8;background:#202d3b}.space{width:660px;height:650px;padding-top:230px}.inner{margin-left:220px;width:260px;height:180px;overflow:auto;border:2px solid #b88759;background:#382c25}.content{position:relative;width:600px;height:540px}.target{position:absolute;left:300px;top:270px;width:90px;height:50px;background:#46c787;color:#111;text-align:center;padding-top:14px;border:2px solid white}.status{height:92px;white-space:pre-wrap;font:12px monospace}.thread{height:130px;overflow:auto;border:2px solid #6796b8}.message{height:45px;padding:10px;border-bottom:1px solid #777}.message:last-child{background:#245a88}
</style></head><body><h2>Scroll alignment</h2><div><button id=start>Start</button><button id=center>Center</button><button id=end>End</button><button id=nearest>Nearest</button></div><div><button id=innerOnly>Inner only</button><button id=smooth>Smooth</button><button id=reset>Reset</button></div><div id=outer class=outer><div class=space><div id=inner class=inner><div class=content><div id=target class=target>Target</div></div></div></div></div><div id=status class=status>Ready</div><button id=append>Append + reveal</button><div id=thread class=thread></div><script>
const outer=document.getElementById('outer'),inner=document.getElementById('inner'),target=document.getElementById('target'),status=document.getElementById('status'),thread=document.getElementById('thread');
let samples=0, moving=false;
function report(){const o=[outer.scrollLeft,outer.scrollTop].map(Math.round),i=[inner.scrollLeft,inner.scrollTop].map(Math.round);status.textContent='outer: '+o+'\ninner: '+i+'\nscroll events: '+samples;console.log('scroll-state',o.join(','),i.join(','),samples)}
outer.addEventListener('scroll',()=>{samples++;if(!moving)report()});inner.addEventListener('scroll',()=>{samples++;if(!moving)report()});
for(const name of ['start','center','end','nearest'])document.getElementById(name).onclick=()=>{target.scrollIntoView({block:name,inline:name,behavior:'instant'});setTimeout(report,60)};
document.getElementById('innerOnly').onclick=()=>{target.scrollIntoView({block:'center',inline:'center',container:'nearest',behavior:'instant'});setTimeout(report,60)};
document.getElementById('reset').onclick=()=>{outer.scrollTo(0,0);inner.scrollTo(0,0);samples=0;setTimeout(report,60)};
document.getElementById('smooth').onclick=()=>{moving=true;samples=0;target.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});setTimeout(()=>{moving=false;report()},650)};
let count=0;function add(){const item=document.createElement('div');item.className='message';item.textContent='Message '+(++count);thread.appendChild(item);return item}for(let i=0;i<6;i++)add();document.getElementById('append').onclick=()=>{add().scrollIntoView({block:'nearest',behavior:'smooth'})};
</script></body></html>
