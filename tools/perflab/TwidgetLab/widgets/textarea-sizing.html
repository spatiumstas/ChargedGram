<!doctype html><html><head><meta charset=utf-8><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#171717;color:#eee;font:16px/1.4 system-ui}h1{font-size:20px}textarea{display:block;width:100%;font:16px/24px monospace;padding:8px 10px;border:2px solid #888;background:#282828;color:#eee;resize:none;border-radius:10px;margin:12px 0}#grow{height:auto;max-height:180px}button{padding:8px 12px;margin-right:8px;font:16px system-ui;background:#3369c9;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;font:13px/1.4 monospace}
</style></head><body><h1>Textarea size and editing</h1><label>Rows control (starts at 2)</label><textarea id=rows rows=2>one</textarea><button id=one>1 row</button><button id=four>4 rows</button><label style="display:block;margin-top:20px">Composer (grows and shrinks)</label><textarea id=grow rows=1 placeholder="Type here"></textarea><button id=clear>Clear</button><pre id=result></pre><script>
const rows=document.getElementById('rows'),grow=document.getElementById('grow');function report(){document.getElementById('result').textContent=[rows,grow].map(e=>e.id+': height='+e.getBoundingClientRect().height+' client='+e.clientHeight+' scroll='+e.scrollHeight+' value='+JSON.stringify(e.value)).join('\n')};function fit(){grow.style.height='auto';grow.style.height=Math.min(180,grow.scrollHeight+4)+'px';report()};document.getElementById('one').onclick=()=>{rows.setAttribute('rows','1');report()};document.getElementById('four').onclick=()=>{rows.setAttribute('rows','4');report()};document.getElementById('clear').onclick=()=>{grow.value='';fit();grow.focus()};rows.oninput=report;grow.oninput=fit;setTimeout(fit,100)
</script></body></html>
