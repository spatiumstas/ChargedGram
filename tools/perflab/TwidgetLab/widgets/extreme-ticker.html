<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 11px; }
table { border-collapse: collapse; width: 100%; }
td { padding: 2px 4px; text-align: right; font-variant-numeric: tabular-nums; }
.up { color: #34c759; } .down { color: #ff3b30; }
</style>
<table id="t"></table>
<script>
const t = document.getElementById('t');
const rows = 50, cols = 8, cells = [];
let html = '';
for (let r = 0; r < rows; r++) { html += '<tr>'; for (let c = 0; c < cols; c++) html += `<td id="c${r}_${c}">0.00</td>`; html += '</tr>'; }
t.innerHTML = html;
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push(document.getElementById(`c${r}_${c}`));
const values = cells.map((_, i) => 100 + i);
function tick() {
  for (let i = 0; i < cells.length; i++) {
    const d = (Math.random() - 0.5) * 0.4;
    values[i] += d;
    cells[i].textContent = values[i].toFixed(2);
    cells[i].className = d >= 0 ? 'up' : 'down';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
