<!doctype html>
<meta charset="utf-8">
<style>
body { margin: 20px; background: #17232c; color: #eee; font: 16px/1.4 system-ui }
input, textarea { display: block; box-sizing: border-box; width: 360px; padding: 10px; border: 2px solid #649ab5; background: #253d4a; color: white; font: 16px/24px Courier; margin: 12px 0 }
textarea { height: 120px; resize: none }
button { padding: 8px; margin: 4px; color: white; background: #285b7a; border: 0; border-radius: 6px }
pre { white-space: pre-wrap; font: 13px/1.5 Courier }
</style>
<h2>Click and drag text</h2>
<label>Single line<input id="single" value="alpha bravo charlie"></label>
<label>Multiple lines<textarea id="multi">alpha bravo charlie
delta echo foxtrot
golf hotel india</textarea></label>
<label>Read only<input readonly value="select this text"></label>
<button id="reset">Reset</button>
<pre id="result">Click within a word or drag a selection, then type.</pre>
<script>
const single = document.getElementById('single');
const multi = document.getElementById('multi');
const result = document.getElementById('result');
function report() { result.textContent = 'Input: ' + single.value + '\nTextarea: ' + multi.value; }
single.oninput = report;
multi.oninput = report;
document.getElementById('reset').onclick = () => {
  single.value = 'alpha bravo charlie';
  multi.value = 'alpha bravo charlie\ndelta echo foxtrot\ngolf hotel india';
  report();
};
</script>
