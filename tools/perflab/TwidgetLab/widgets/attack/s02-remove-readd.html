<style>@keyframes sh{from{background-position:-300px 0}to{background-position:300px 0}}.s{height:20px;margin:4px;border-radius:6px;background:linear-gradient(90deg,#eee 0%,#ccc 50%,#eee 100%) no-repeat;background-size:200px 100%;animation:sh 1s linear infinite}</style><div id=r></div><script>const r=document.getElementById("r");for(let i=0;i<6;i++){const d=document.createElement("div");d.className="s";r.appendChild(d)}setInterval(()=>{const c=r.children;const d=c[(Math.random()*c.length)|0];d.remove();const n=document.createElement("div");n.className="s";r.appendChild(n)},60)</script>
