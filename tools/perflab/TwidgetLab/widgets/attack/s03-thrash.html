<style>@keyframes sh{from{background-position:-300px 0}to{background-position:300px 0}}.s{height:20px;margin:4px;border-radius:6px;background:linear-gradient(90deg,#eee 0%,#ccc 50%,#eee 100%) no-repeat;background-size:200px 100%;animation:sh 1s linear infinite}</style><style>@keyframes op{0%{opacity:1}50%{opacity:.99}100%{opacity:1}}</style><div id=r></div><script>const r=document.getElementById("r");const els=[];for(let i=0;i<8;i++){const d=document.createElement("div");d.className="s";r.appendChild(d);els.push(d)}let f=0;function tick(){f++;for(const d of els){d.style.animation=f%2?"sh 1s linear infinite":"sh 1s linear infinite, op 1s linear infinite"}requestAnimationFrame(tick)}tick()</script>
