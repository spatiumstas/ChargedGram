<style>@keyframes sh{from{background-position:-300px 0}to{background-position:300px 0}}.s{height:20px;margin:4px;border-radius:6px;background:linear-gradient(90deg,#eee 0%,#ccc 50%,#eee 100%) no-repeat;background-size:200px 100%;animation:sh 1s linear infinite}</style><div id=r></div><script>const r=document.getElementById("r");for(let i=0;i<6;i++){const d=document.createElement("div");d.className="s";r.appendChild(d)}let t=0;setInterval(()=>{t++;const x=document.createElement("div");x.style.height=(t%2?"40px":"0px");x.textContent="spacer";r.insertBefore(x,r.firstChild);if(r.children.length>12)r.removeChild(r.firstChild)},150)</script>
