<style>@keyframes sh{from{background-position:-300px 0}to{background-position:300px 0}}.s{height:20px;margin:4px;border-radius:6px;background:linear-gradient(90deg,#eee 0%,#ccc 50%,#eee 100%) no-repeat;background-size:200px 100%;animation:sh 1s linear infinite}</style><div id=r></div><script>const r=document.getElementById("r");for(let i=0;i<66;i++){const d=document.createElement("div");d.className="s";r.appendChild(d)}setInterval(()=>{for(let k=0;k<3;k++){r.removeChild(r.children[(Math.random()*r.children.length)|0]);const d=document.createElement("div");d.className="s";r.insertBefore(d,r.children[(Math.random()*r.children.length)|0]||null)}},300)</script>
