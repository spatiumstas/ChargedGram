<style>@keyframes sh{from{background-position:-300px 0}to{background-position:300px 0}}.s{height:20px;margin:4px;border-radius:6px;background:linear-gradient(90deg,#eee 0%,#ccc 50%,#eee 100%) no-repeat;background-size:200px 100%;animation:sh 1s linear infinite}</style><div id=r></div><script>const r=document.getElementById("r");let n=0;setInterval(()=>{for(let i=0;i<40;i++){const d=document.createElement("div");d.className="s";d.style.backgroundImage="linear-gradient(90deg,hsl("+(n++%360)+",50%,80%),#ccc)";r.appendChild(d)}while(r.children.length>200)r.firstChild.remove()},30)</script>
