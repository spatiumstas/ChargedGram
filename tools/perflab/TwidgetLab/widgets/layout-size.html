<!doctype html><meta charset="utf-8">
<style>body{margin:0;padding:16px;font:15px/1.4 system-ui;background:#17191f;color:white}button{font:inherit;padding:10px;border:0;border-radius:8px;background:#376bad;color:white}#outer{transform:scale(1.2);transform-origin:0 0;height:130px;margin:24px 0}.box{box-sizing:content-box;width:100.25px;height:60.25px;padding:3px;border:2px solid #8edaff;background:#285773;transform:scale(1.5);transform-origin:0 0}pre{white-space:pre-wrap}textarea{display:block;margin-bottom:40px;font:15px system-ui;color:white}</style>
<h2>Layout size vs visual scale</h2><button id="toggle">Toggle scale</button>
<div id="outer"><div class="box" id="target">Scaled box</div></div>
<pre id="result"></pre><textarea class="box" id="editor">Editable</textarea><pre id="editresult"></pre>
<script>
var scaled=true;
function read(){var t=document.getElementById('target'),e=document.getElementById('editor');function describe(n){return 'offset: '+n.offsetWidth+' × '+n.offsetHeight+'\nvisual: '+n.getBoundingClientRect().width.toFixed(2)+' × '+n.getBoundingClientRect().height.toFixed(2)}document.getElementById('result').textContent=describe(t);document.getElementById('editresult').textContent=describe(e)}
document.getElementById('toggle').onclick=function(){scaled=!scaled;document.getElementById('target').style.transform=scaled?'scale(1.5)':'none';document.getElementById('editor').style.transform=scaled?'scale(1.5)':'none';read()};setTimeout(read,100);
</script>
