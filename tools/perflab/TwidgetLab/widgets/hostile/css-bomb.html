<style>
@keyframes k { from { transform: translateX(0) } to { transform: translateX(1e30px) } }
.a { animation: k 0.001s infinite; transition: all 1e-9s; }
</style>
<div class="a" id="x">anim</div>
<script>
const x = document.getElementById('x');
let n = 0;
const tick = () => { x.style.transform = 'scale(' + (n++ % 100) + ')'; x.className = n % 2 ? 'a' : 'a b'; requestAnimationFrame(tick); };
requestAnimationFrame(tick);
for (let i = 0; i < 2000; i++) { const t = document.createElement('table'); t.innerHTML = '<tr>' + '<td colspan=1000 rowspan=1000>x</td>'.repeat(50) + '</tr>'; x.appendChild(t); }
</script>
