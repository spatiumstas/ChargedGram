<style>.a{color:red}.b{font-weight:bold}.c{padding:2px}.d{background:#eee}[data-x="1"]{border:1px solid blue}</style>
<div id=root style="font:13px sans-serif"></div>
<script>
const root=document.getElementById('root');const els=[];const lists=[];const nodes=[];let bad=0,errs=0,n=0;
for(let i=0;i<60;i++){const d=document.createElement('div');d.className='a';d.textContent='row '+i;root.appendChild(d);els.push(d);}
const mo=new MutationObserver(r=>{n+=r.length});
const toks=['a','b','c','d','a b','b  c','',' a ','x-y','a\tb'];
function pick(a){return a[(Math.random()*a.length)|0]}
function step(){
 for(let k=0;k<40;k++){
  const e=pick(els);
  try{
  switch((Math.random()*16)|0){
   case 0:e.className=pick(toks);break;
   case 1:e.className=e.className;break;
   case 2:e.setAttribute('class',pick(toks));break;
   case 3:lists.push(e.classList);break;
   case 4:{const l=pick(lists);if(l){l.toggle(pick(['a','b','c']))}}break;
   case 5:{const l=pick(lists);if(l){l.add('d');l.remove('a')}}break;
   case 6:{const l=pick(lists);if(l){l.value=pick(toks)}}break;
   case 7:{const a=e.getAttributeNode('class');if(a){nodes.push(a);a.value=pick(toks)}}break;
   case 8:{const a=pick(nodes);if(a)a.value=pick(toks)}break;
   case 9:e.removeAttribute('class');break;
   case 10:e.setAttribute('data-x',String(k&1));e.dataset.y=String(k);break;
   case 11:e.toggleAttribute('hidden',false);e.getAttribute('class');break;
   case 12:{const a=document.createAttribute('class');a.value=pick(toks);e.setAttributeNode(a);nodes.push(a)}break;
   case 13:{const c=e.cloneNode(true);root.appendChild(c);els.push(c);if(els.length>150)els.shift().remove()}break;
   case 14:if(k%7===0){mo.disconnect();if(Math.random()<0.5)mo.observe(root,{attributes:true,subtree:true,attributeOldValue:true})}break;
   case 15:e.className=e.className+' b';break;
  }}catch(x){errs++}
 }
 if(lists.length>300)lists.length=0;if(nodes.length>300)nodes.length=0;
}
function check(){for(const e of els){const c=e.getAttribute('class');const l=e.classList.value;if((c??'')!==l)bad++;if(e.className!==(c??''))bad++}}
setInterval(step,8);document.addEventListener('click',step);
setInterval(()=>{check();console.log('mo '+n+' err '+errs+' bad '+bad)},500);
</script>
