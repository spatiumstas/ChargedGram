<div id=root style="font:14px sans-serif"></div>
<script>
const root=document.getElementById('root');const els=[];const errs=[];
for(let i=0;i<60;i++){const d=document.createElement('div');d.textContent='item '+i;root.appendChild(d);els.push(d);}
const held=[];let n=0;
const mo=new MutationObserver(r=>{n+=r.length});mo.observe(root,{childList:true,subtree:true,characterData:true});
function step(){
 for(let k=0;k<40;k++){
  const e=els[(Math.random()*els.length)|0];
  try{
  switch((Math.random()*12)|0){
   case 0:e.textContent='t'+Math.random();break;
   case 1:if(e.firstChild)held.push(e.firstChild);break;
   case 2:e.textContent='';break;
   case 3:e.appendChild(document.createTextNode('+'));break;
   case 4:if(e.firstChild&&e.firstChild.nodeType===3)e.firstChild.data='d'+k;break;
   case 5:e.replaceChildren(document.createTextNode('r'+k));break;
   case 6:e.normalize();break;
   case 7:{const h=held[(Math.random()*held.length)|0];if(h){e.appendChild(h)}}break;
   case 8:e.innerHTML='<b>x</b>y';break;
   case 9:{const t=e.firstChild;e.textContent='after';if(t)t.data='stale';}break;
   case 10:e.childNodes.length;e.textContent=String(k);break;
   case 11:{const c=e.cloneNode(true);root.appendChild(c);els.push(c);if(els.length>200)els.shift().remove();}break;
  }}catch(x){errs.push(String(x))}
 }
 if(held.length>300)held.length=0;
}
setInterval(step,8);document.addEventListener('click',step);
let bad=0;function walk(e){let s='';for(const c of e.childNodes){s+=c.nodeType===3?c.data:c.nodeType===1?walk(c):''}if(e.textContent!==s)bad++;return s}
setInterval(()=>{walk(root);for(const e of els){if(e.firstChild&&e.firstChild.parentNode!==e)bad++}const t=document.getElementById('root').textContent.length;console.log('len '+t+' mo '+n+' err '+errs.length+' bad '+bad)},500);
</script>
