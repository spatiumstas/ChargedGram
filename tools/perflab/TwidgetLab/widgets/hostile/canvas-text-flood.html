<!doctype html>
<style>
body{margin:0;padding:16px;background:#17191f;color:#f7f8fc;font:16px/1.4 system-ui}h2{margin:0 0 8px}p{color:#bfc8d6}button,input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #51617a;background:#263954;color:white;margin:6px 0}canvas{display:block;width:340px;height:150px;max-width:100%;background:#10141b;border:1px solid #51617a;border-radius:8px}input{display:block;width:300px;max-width:90%}#status{margin:12px 0;color:#9dd6ff}
</style>
<h2>Canvas text flood</h2>
<p>The long line tests the text budget. The short label and input should keep working.</p>
<button id="run">Run flood</button>
<canvas id="canvas" width="340" height="150"></canvas>
<div id="status">Ready</div>
<input placeholder="Type here during the flood">
<script>
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),timer=null,attempt=0;
function draw(flood){
  ctx.fillStyle='#10141b';ctx.fillRect(0,0,340,150);ctx.fillStyle='#f7f8fc';ctx.font='16px sans-serif';
  ctx.fillText(flood?'Long '+attempt+' '+String.fromCharCode(0x4e00+attempt%200).repeat(3000):'Ready',12,40);
  ctx.fillStyle='#7fe3bc';ctx.fillText('Short label: '+attempt,12,100);
}
function run(){
  if(timer)clearInterval(timer);attempt=0;document.getElementById('status').textContent='Running';
  timer=setInterval(function(){attempt++;draw(true);document.getElementById('status').textContent='Attempt '+attempt+' / 60';if(attempt===60){clearInterval(timer);timer=null;document.getElementById('status').textContent='Finished: 60 attempts'}},25);
}
document.getElementById('run').onclick=run;draw(false);
</script>
