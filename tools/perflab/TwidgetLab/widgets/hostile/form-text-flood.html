<!doctype html>
<meta charset="utf-8">
<style>
body { margin: 20px; background: #17232c; color: #eee; font: 16px/1.4 system-ui }
input, textarea { display: block; box-sizing: border-box; width: 340px; padding: 8px; margin: 14px 0; background: #243e50; color: white; border: 1px solid #6598ab; font: 15px/1.4 system-ui }
button { padding: 8px; margin: 4px; background: #285b7a; color: white; border: none; border-radius: 6px }
</style>
<h2>Form text flood</h2>
<p>The protected field should stop accepting large updates. Normal typing must still work.</p>
<input id="normal" value="Normal input">
<input id="flood" value="Ready" placeholder="Ready">
<textarea id="notes" rows="3" placeholder="Normal notes"></textarea>
<button id="values">Value flood</button><button id="placeholders">Placeholder flood</button><button id="reset">Reset</button>
<p id="status">Idle</p>
<script>
const flood = document.getElementById('flood');
const status = document.getElementById('status');
let timer;
function run(property) {
  clearInterval(timer);
  flood.value = '';
  let count = 0;
  timer = setInterval(() => {
    count++;
    const text = 'Attempt ' + count + ': ' + String.fromCharCode(0x4e00 + count).repeat(3000);
    if (property) flood.value = text;
    else flood.setAttribute('placeholder', text);
    status.textContent = 'Sent ' + count + ' large updates';
    if (count === 60) { clearInterval(timer); console.log('Flood finished: ' + (property ? 'value' : 'placeholder')); }
  }, 25);
}
document.getElementById('values').onclick = () => run(true);
document.getElementById('placeholders').onclick = () => run(false);
document.getElementById('reset').onclick = () => {
  clearInterval(timer);
  flood.value = 'Ready';
  flood.setAttribute('placeholder', 'Ready');
  status.textContent = 'Reset';
};
</script>
