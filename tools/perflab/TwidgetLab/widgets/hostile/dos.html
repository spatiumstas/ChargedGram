<div id="root"></div>
<script>
let p = document.getElementById('root');
for (let i = 0; i < 3000; i++) { const d = document.createElement('div'); p.appendChild(d); p = d; }
const wide = document.getElementById('root');
for (let i = 0; i < 30000; i++) { const s = document.createElement('span'); s.textContent = 'x'; wide.appendChild(s); }
for (let i = 0; i < 40; i++) { const c = document.createElement('canvas'); c.width = 8000; c.height = 8000; c.getContext('2d').fillRect(0, 0, 8000, 8000); wide.appendChild(c); }
document.body.style.setProperty('--x', 'light-dark('.repeat(5000));
setTimeout(() => { for (;;) {} }, 50);
</script>
