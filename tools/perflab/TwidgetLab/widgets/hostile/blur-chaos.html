<style>
.wrap{position:relative;height:260px;overflow:hidden;background:linear-gradient(45deg,#f06,#4af,#fd0)}
.dot{position:absolute;width:40px;height:40px;border-radius:20px;background:#08f}
.glass{position:absolute;left:20px;top:40px;width:200px;height:120px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.2);border-radius:16px}
.soft{filter:blur(6px) drop-shadow(0 4px 8px rgba(0,0,0,.4))}
</style>
<div class=wrap id=w><div class=glass id=g>glass</div></div>
<script>
const w=document.getElementById('w'),g=document.getElementById('g');const dots=[];
for(let i=0;i<14;i++){const d=document.createElement('div');d.className='dot';w.insertBefore(d,g);dots.push(d)}
let t=0;
function frame(){t++;
 dots.forEach((d,i)=>{d.style.left=((t*3+i*29)%300)+'px';d.style.top=((t*2+i*17)%220)+'px';if((t+i)%40===0)d.classList.toggle('soft')});
 const b=4+(t%30);g.style.backdropFilter='blur('+b+'px)';g.style.webkitBackdropFilter='blur('+b+'px)';
 if(t%25===0){g.style.filter=t%50===0?'blur(3px)':'none'}
 if(t%60===0){const c=g.cloneNode(true);c.style.left=(t%150)+'px';w.appendChild(c);setTimeout(()=>c.remove(),200)}
 requestAnimationFrame(frame)}
frame();document.addEventListener('click',()=>{g.classList.toggle('soft');w.style.filter=w.style.filter?'':'blur(2px)'});
</script>
