<div id="root"></div>
<script>
let p = document.getElementById('root'), depth = 0, spans = 0, canvases = 0;
const step = () => {
  for (let i = 0; i < 100 && depth < 3000; i++, depth++) { const d = document.createElement('div'); p.appendChild(d); p = d; }
  const wide = document.getElementById('root');
  for (let i = 0; i < 500 && spans < 30000; i++, spans++) { const s = document.createElement('span'); s.textContent = 'x'; wide.appendChild(s); }
  if (canvases < 40) { const c = document.createElement('canvas'); c.width = 8000; c.height = 8000; c.getContext('2d').fillRect(0, 0, 8000, 8000); wide.appendChild(c); canvases++; }
  if (depth < 3000 || spans < 30000 || canvases < 40) setTimeout(step, 10);
};
step();
</script>
