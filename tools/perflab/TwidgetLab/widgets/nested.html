<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
.stage { position: relative; height: 240px; }
.fl { position: absolute; top: 180px; animation: wob 2s linear infinite; }
.fl span { display: inline-block; width: 30px; height: 30px; border-radius: 15px; background: #ff2d55; transform-origin: top center; animation: rise 2.4s linear infinite; }
@keyframes wob { 0% { transform: translateX(0); } 50% { transform: translateX(30px); } 100% { transform: translateX(0); } }
@keyframes rise { 0% { transform: translateY(0) scale(0); } 10% { transform: translateY(-20px) scale(1); } 100% { transform: translateY(-160px) scale(.3); } }
</style>
<div class="stage" id="stage"><div class="fl" style="left: 40px"><span></span></div></div>
<script>
setTimeout(() => {
  const el = document.createElement('div');
  el.className = 'fl'; el.style.left = '200px';
  el.innerHTML = '<span></span>';
  document.getElementById('stage').appendChild(el);
}, 1200);
</script>
