<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 12px; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
.c { width: 54px; height: 40px; border-radius: 10px; color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center; animation: bob 1.6s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-6px) scale(1.08); opacity: 0.7; } }
</style>
<div class="grid" id="g"></div>
<script>
const g = document.getElementById('g');
const colors = ['#ff3b30', '#ff9500', '#34c759', '#007aff', '#5856d6', '#af52de'];
let html = '';
for (let i = 0; i < 120; i++) html += `<div class="c" style="background:${colors[i % 6]};animation-delay:-${(i * 0.07).toFixed(2)}s">${i}</div>`;
g.innerHTML = html;
</script>
