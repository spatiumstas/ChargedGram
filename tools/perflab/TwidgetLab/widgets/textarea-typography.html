<!doctype html><html><head><meta charset=utf-8><style>body{margin:0;padding:20px;background:#171717;color:#eee;font:16px/1.4 system-ui}h1{font-size:20px}textarea{box-sizing:border-box;display:block;width:100%;height:210px;font:16px/24px monospace;padding:10px;border:2px solid #888;background:#282828;color:#eee;resize:none;border-radius:10px}pre{white-space:pre-wrap;font:13px/1.4 monospace}button{padding:8px 12px;font:16px system-ui;background:#3369c9;color:white;border:0;border-radius:8px}</style></head><body><h1>Editor font and line spacing</h1><p>Click the field: text should keep its font and spacing.</p><textarea id=entry>one
two
three</textarea><p>Typing ! changes the font, spacing and alignment while editing.</p><button id=replace>Replace value</button><pre id=result></pre><script>
const entry=document.getElementById('entry');function report(){const style=getComputedStyle(entry);document.getElementById('result').textContent='font='+style.fontFamily+' lineHeight='+style.lineHeight+' alignment='+style.textAlign+'\nvalue='+JSON.stringify(entry.value)};entry.oninput=()=>{if(entry.value.endsWith('!')){entry.style.fontFamily='serif';entry.style.fontSize='20px';entry.style.lineHeight='32px';entry.style.textAlign='right'}report()};document.getElementById('replace').onclick=()=>{entry.value='replacement\nsecond line';entry.focus();report()};setTimeout(report,100)
</script></body></html>
