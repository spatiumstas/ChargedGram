<style>
:root { color-scheme:light dark; --bg:light-dark(#f4f5f8,#17191f); --fg:light-dark(#172034,#f2f5ff); --card:light-dark(#fff,#272c37); }
body { margin:0; padding:18px; box-sizing:border-box; font:14px -apple-system,sans-serif; background:var(--bg); color:var(--fg); }
h2 { margin:0 0 6px; font-size:22px; } p { margin:0 0 16px; opacity:.65; }
button { border:0; padding:8px 16px; border-radius:9px; background:#007aff; color:white; font:inherit; cursor:pointer; margin-right:8px; }
.toolbar { margin-bottom:18px; }

.scene { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.tile { border-radius:18px; height:128px; padding:12px; box-sizing:border-box; background:radial-gradient(circle at 25% 20%,#fdb46b,#a952cc 50%,#2068cb); color:white; transition:transform .65s ease-in-out, height .65s ease-in-out; }
.tile:nth-child(2n) { background:conic-gradient(from 40deg,#087def,#b039e9,#ee8e34,#087def); }
.scene.on .tile { height:105px; transform:scale(.94) translate(3px,5px); }
.tile b { font-size:23px; display:block; margin-top:26px; }
</style><h2>Gradient dashboard</h2><p>Twelve gradient tiles scale and refresh their readings.</p><div class="toolbar"><button id="pause">Pause</button><button id="step">Next state</button></div><div class="scene" id="scene"><div class="tile">Sensor 1<b id="v0">20.0°</b></div><div class="tile">Sensor 2<b id="v1">21.0°</b></div><div class="tile">Sensor 3<b id="v2">22.0°</b></div><div class="tile">Sensor 4<b id="v3">23.0°</b></div><div class="tile">Sensor 5<b id="v4">24.0°</b></div><div class="tile">Sensor 6<b id="v5">25.0°</b></div><div class="tile">Sensor 7<b id="v6">26.0°</b></div><div class="tile">Sensor 8<b id="v7">27.0°</b></div><div class="tile">Sensor 9<b id="v8">28.0°</b></div><div class="tile">Sensor 10<b id="v9">29.0°</b></div><div class="tile">Sensor 11<b id="v10">30.0°</b></div><div class="tile">Sensor 12<b id="v11">31.0°</b></div></div><script>let running=true, phase=0;
document.getElementById('pause').onclick=()=>{ running=!running; document.getElementById('pause').textContent=running?'Pause':'Resume'; };
document.getElementById('step').onclick=()=>advance();
setInterval(()=>{if(running)advance();},900);
function advance(){ phase++;document.getElementById('scene').classList.toggle('on',phase%2===1);for(let i=0;i<12;i++)document.getElementById('v'+i).textContent=(20+i+(phase%5)/10).toFixed(1)+'°'; }</script>
