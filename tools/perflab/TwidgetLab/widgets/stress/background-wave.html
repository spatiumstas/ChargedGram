<style>
:root { color-scheme:light dark; --bg:light-dark(#f4f5f8,#17191f); --fg:light-dark(#172034,#f2f5ff); --card:light-dark(#fff,#272c37); }
body { margin:0; padding:18px; box-sizing:border-box; font:14px -apple-system,sans-serif; background:var(--bg); color:var(--fg); }
h2 { margin:0 0 6px; font-size:22px; } p { margin:0 0 16px; opacity:.65; }
button { border:0; padding:8px 16px; border-radius:9px; background:#007aff; color:white; font:inherit; cursor:pointer; margin-right:8px; }
.toolbar { margin-bottom:18px; }

.scene { display:grid; grid-template-columns:repeat(9,1fr); gap:2px; }
.cell { height:42px; display:flex; align-items:center; justify-content:center; border:1px solid #80808055; animation:wave 1.4s ease-in-out var(--delay) infinite; }
.number { width:24px; height:24px; line-height:24px; text-align:center; font-size:22px; font-weight:600; animation:pop .7s ease-in-out var(--delay) infinite alternate; }
.scene.alternate .cell { animation-name:wave-again; }
.scene.alternate .number { animation-name:pop-again; }
.scene.paused .cell,.scene.paused .number { animation-play-state:paused; }
@keyframes wave { 0%,100%{background-color:#34c75900} 50%{background-color:#34c75988} }
@keyframes wave-again { 0%,100%{background-color:#34c75900} 50%{background-color:#34c75988} }
@keyframes pop { from{transform:scale(.55)} to{transform:scale(1)} }
@keyframes pop-again { from{transform:scale(.55)} to{transform:scale(1)} }
</style>
<h2>Cell animation wave</h2>
<p>81 backgrounds pulse while their numbers scale independently.</p>

<script>
let paused=false, alternate=false;
document.getElementById('pause').onclick=()=>{
  paused=!paused;
  document.getElementById('pause').textContent=paused?'Resume':'Pause';
  document.getElementById('scene').classList.toggle('paused',paused);
};
document.getElementById('replay').onclick=()=>{
  alternate=!alternate;
  document.getElementById('scene').classList.toggle('alternate',alternate);
};
</script>
