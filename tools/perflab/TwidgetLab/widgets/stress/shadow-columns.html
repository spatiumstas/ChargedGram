<style>
:root { color-scheme:light dark; --bg:light-dark(#f4f5f8,#17191f); --fg:light-dark(#172034,#f2f5ff); --card:light-dark(#fff,#272c37); }
body { margin:0; padding:18px; box-sizing:border-box; font:14px -apple-system,sans-serif; background:var(--bg); color:var(--fg); }
h2 { margin:0 0 6px; font-size:22px; } p { margin:0 0 16px; opacity:.65; }
button { border:0; padding:8px 16px; border-radius:9px; background:#007aff; color:white; font:inherit; cursor:pointer; margin-right:8px; }
.toolbar { margin-bottom:18px; }

.meters { display:flex; gap:22px; padding:30px 14px; height:410px; align-items:flex-end; }
.meter { width:54px; height:280px; background:#3595ea; border-radius:18px; box-shadow:8px 0 24px #0088ff77; transition:height .65s ease-in-out, box-shadow .65s ease-in-out; }
.meters.on .meter { height:190px; box-shadow:-6px 0 16px #af52de66; }
.meter:nth-child(2n) { background:#a45cec; height:210px; }
.meters.on .meter:nth-child(2n) { height:350px; }
</style><h2>Animated energy columns</h2><p>Six tall glowing meters resize together.</p><div class="toolbar"><button id="pause">Pause</button><button id="step">Next state</button></div><div class="meters" id="scene"><div class="meter"></div><div class="meter"></div><div class="meter"></div><div class="meter"></div><div class="meter"></div><div class="meter"></div></div><script>let running=true, phase=0;
document.getElementById('pause').onclick=()=>{ running=!running; document.getElementById('pause').textContent=running?'Pause':'Resume'; };
document.getElementById('step').onclick=()=>advance();
setInterval(()=>{if(running)advance();},900);
function advance(){ document.getElementById('scene').classList.toggle('on',++phase%2===1); }</script>
