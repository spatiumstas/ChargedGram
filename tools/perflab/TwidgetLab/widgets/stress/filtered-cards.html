<style>
:root { color-scheme:light dark; --bg:light-dark(#f4f5f8,#17191f); --fg:light-dark(#172034,#f2f5ff); --card:light-dark(#fff,#272c37); }
body { margin:0; padding:18px; box-sizing:border-box; font:14px -apple-system,sans-serif; background:var(--bg); color:var(--fg); }
h2 { margin:0 0 6px; font-size:22px; } p { margin:0 0 16px; opacity:.65; }
button { border:0; padding:8px 16px; border-radius:9px; background:#007aff; color:white; font:inherit; cursor:pointer; margin-right:8px; }
.toolbar { margin-bottom:18px; }

.scene { height:440px; position:relative; overflow:hidden; }
.panel { position:absolute; left:36px; top:30px; width:380px; height:135px; border-radius:24px; padding:16px; box-sizing:border-box; color:white; background:linear-gradient(120deg,#1261c4,#d449b5); filter:blur(1px) drop-shadow(8px 12px 12px #0008); transition:transform .65s ease-in-out; }
.panel:nth-child(2) { top:150px; left:76px; background:linear-gradient(40deg,#15977a,#086be8); }
.panel:nth-child(3) { top:270px; left:16px; background:linear-gradient(70deg,#ee7824,#cf285a); }
.scene.on .panel { transform:translate(24px,12px) scale(.96); }
.panel b { font-size:26px; display:block; margin:10px 0; }
</style><h2>Filtered overlapping cards</h2><p>Blur, shadows, gradients and text moving under a clip.</p><div class="toolbar"><button id="pause">Pause</button><button id="step">Next state</button></div><div class="scene" id="scene"><div class="panel"><b>Panel 1</b><span><span class="reading">Live reading: 0</span> with a soft filtered edge</span></div><div class="panel"><b>Panel 2</b><span><span class="reading">Live reading: 0</span> with a soft filtered edge</span></div><div class="panel"><b>Panel 3</b><span><span class="reading">Live reading: 0</span> with a soft filtered edge</span></div></div><script>let running=true, phase=0;
document.getElementById('pause').onclick=()=>{ running=!running; document.getElementById('pause').textContent=running?'Pause':'Resume'; };
document.getElementById('step').onclick=()=>advance();
setInterval(()=>{if(running)advance();},900);
function advance(){ document.getElementById('scene').classList.toggle('on',++phase%2===1); }let reading=0;setInterval(()=>{if(running){reading++;document.querySelectorAll('.reading').forEach((el,i)=>el.textContent='Live reading: '+(reading+i));}},100);</script>
