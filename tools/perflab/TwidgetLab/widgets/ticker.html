<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; }
.list { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
.card { padding: 10px; border-radius: 12px; color: #fff; font-weight: 700; background-color: #5856d6; }
.slow { background-color: #ff9500; }
</style>
<div class="list" data-transition="move"><div class="card" data-key="fast">Frame <span id="fast">0</span></div><div class="card slow" data-key="slow">Tick <span id="slow">0</span></div><div class="card" data-key="still" style="background-color: #34c759">Still</div></div>
<script>
let frames = 0, ticks = 0;
function frame() { frames++; document.getElementById('fast').textContent = frames; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
setInterval(() => { ticks++; document.getElementById('slow').textContent = ticks * 1000; }, 500);
</script>
