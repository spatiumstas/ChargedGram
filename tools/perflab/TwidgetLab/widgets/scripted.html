<style>
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
.stage { position: relative; height: 220px; background: linear-gradient(135deg, #f2f2f7, #e5e5ea); border-radius: 14px; overflow: hidden; }
.card { position: absolute; left: 30px; top: 40px; width: 120px; padding: 12px; border-radius: 12px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-weight: 600; }
.dot { position: absolute; left: 220px; top: 120px; width: 44px; height: 44px; border-radius: 22px; background: #ff2d55; }
.spin { position: absolute; left: 300px; top: 30px; width: 50px; height: 50px; border-radius: 10px; background: conic-gradient(#0a84ff, #34c759, #ff9f0a, #0a84ff); }
</style>
<div class="stage"><div class="card" id="card">Hello there<br><small>scripted card</small></div><div class="dot" id="dot"></div><div class="spin" id="spin"></div></div>
<script>
const card = document.getElementById('card'), dot = document.getElementById('dot'), spin = document.getElementById('spin');
let frame = 0;
function tick() {
  frame++;
  const t = Math.min(frame, 40) / 40;
  card.style.transform = 'translate(' + (t * 40).toFixed(2) + 'px, ' + (t * 20).toFixed(2) + 'px) rotate(' + (t * 8).toFixed(2) + 'deg)';
  dot.style.transform = 'scale(' + (1 + t * 0.6).toFixed(3) + ')';
  dot.style.opacity = (1 - t * 0.4).toFixed(3);
  spin.style.transform = 'rotate(' + (t * 135).toFixed(2) + 'deg)';
  if (frame < 40) requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
