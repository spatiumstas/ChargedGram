<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:15px/1.35 system-ui}.page{padding:16px;display:flex;flex-direction:column;gap:12px}.card{display:flex;gap:12px;align-items:center;padding:12px;background:#262626;border-radius:18px}.icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex-shrink:0;border-radius:12px;background:#8473db}.content{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.title{font-weight:600}.meta{display:flex;gap:10px;color:#aaa;font-size:12px}.composer{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#151515;display:flex;align-items:flex-end;gap:8px}textarea{display:block;resize:none;width:100%;height:auto;min-height:40px;max-height:160px;padding:10px;border:1px solid #555;border-radius:18px;background:#262626;color:#eee;font:15px/20px system-ui}.send{flex-shrink:0;background:#8473db;padding:10px;border-radius:20px}#metrics{font:12px monospace}</style></head><body><div class=page id=cards></div><div class=composer><textarea id=entry>Typing</textarea><span class=send>Send</span></div><script>
const cards=document.getElementById('cards'),entry=document.getElementById('entry');
cards.innerHTML=Array.from({length:48},(_,i)=>'<div class="card"><span class="icon">'+(i+1)+'</span><div class="content"><span class="title">Dashboard card '+(i+1)+'</span><span class="meta"><span>Doing</span><span>Progress '+((i*7)%100)+'%</span><span>2 comments</span></span></div></div>').join('');
const message='Typing into a dashboard composer should preserve layout and stay responsive while the message wraps across lines.';
let step=0,total=0,worst=0;
setTimeout(()=>{const timer=setInterval(()=>{const t=performance.now();entry.value=message.slice(0,7+(step%50));entry.style.height='auto';entry.style.height=entry.scrollHeight+'px';const elapsed=performance.now()-t;total+=elapsed;worst=Math.max(worst,elapsed);if(++step===80){clearInterval(timer);console.log('TEXTAREA_FIT count='+step+' totalMs='+total.toFixed(3)+' worstMs='+worst.toFixed(3))}},20)},600);
</script></body></html>
