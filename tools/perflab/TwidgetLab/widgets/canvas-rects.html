<style>body { margin: 0; } canvas { display: block; width: 400px; height: 300px; }</style>
<canvas id="cv" width="800" height="600"></canvas>
<script>
const ctx = document.getElementById('cv').getContext('2d');
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, 800, 600);
ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(300, 40); ctx.lineTo(120, 200);
for (let i = 0; i < 400; i++) {
  ctx.save();
  if (i % 7 === 0) ctx.rotate((rnd() - 0.5) * 0.4);
  if (i % 5 === 0) ctx.globalAlpha = 0.3 + rnd() * 0.7;
  if (i % 11 === 0) { ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3; }
  if (i % 13 === 0) ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `hsla(${Math.floor(rnd() * 360)},80%,55%,${(0.4 + rnd() * 0.6).toFixed(2)})`;
  const w = rnd() * 60 - (i % 17 === 0 ? 70 : 0);
  ctx.fillRect(rnd() * 760 + 0.37, rnd() * 560 + 0.61, w, rnd() * 40 + 0.5);
  ctx.restore();
}
ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
</script>
