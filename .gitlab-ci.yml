before_script:
    - bash ./buildbox/ci-log.sh bash ./buildbox/sync-toolbox.sh

default:
    after_script:
        - 'if [ "$CI_JOB_STATUS" = "failed" ]; then bash ../deploy/notify-ci-failure.sh || true; fi'
    artifacts:
        when: always
        expire_in: 7 days
        paths:
            - .ci-build-logs/

stages:
    - deploy

variables:
    LANG: "en_US.UTF-8"
    LC_ALL: "en_US.UTF-8"
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_STRATEGY: fetch


beta:
    resource_group: telegram-mac-build
    tags:
        - beta
    stage: deploy
    only:
        - beta
    except:
        - tags
    script:
        - bash ./buildbox/ci-log.sh sh ./buildbox/internal.sh Beta
    environment:
        name: beta

more-glass:
    resource_group: telegram-mac-build
    tags:
